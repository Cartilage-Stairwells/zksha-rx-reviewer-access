[package]
name = "avx512_butterfly"
version = "0.1.0"
edition = "2021"

[dependencies]
sha2 = "0.10"
serde_json = "1"
p3-baby-bear = "0.1"
p3-field = "0.1"
p3-dft = "0.1"
p3-matrix = "0.1"
p3-air = "0.1"
p3-challenger = "0.1"
p3-commit = "0.1"
p3-fri = "0.1"
p3-merkle-tree = "0.1"
p3-poseidon2 = "0.1"
p3-symmetric = "0.1"
p3-uni-stark = "0.1"
p3-util = "0.1"
rand = "0.8"

[dev-dependencies]
proptest = "1"
criterion = "0.5"

[features]
default = ["std"]
std = []
# Passthrough: enables p3-baby-bear's 16-wide AVX-512 PackedBabyBear (nightly + avx512f required)
nightly-features = ["p3-baby-bear/nightly-features"]

[[test]]
name = "prover_fixture"
path = "tests/prover_fixture.rs"

[[test]]
name = "stark_prover_fixture"
path = "tests/stark_prover_fixture.rs"

[[bench]]
name = "b4k_lanes"
harness = false

[[bench]]
name = "b4p_prover"
harness = false
